# =====================================================
# AL AI Platform Admin
# API: 全 POST + @RequestBody，路径 /api/admin/{模块}/{操作}
# =====================================================

server:
  port: 8282

spring:
  application:
    name: al-ai-platform-langchain4j-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  datasource:
    # 默认地址 aliyun-2c2g:3307；账密由 profile（application-local.yml）或环境变量提供
    # common=平台通用能力；user=账号会话；biz=业务数据（后续启用）
    common:
      url: jdbc:mysql://${ALAI_DB_HOST:aliyun-2c2g}:${ALAI_DB_PORT:3307}/al-ai-platform-common?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
      username: ${ALAI_DB_USER:root}
      password: ${ALAI_DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        max-lifetime: 580000
        idle-timeout: 520000
        connection-timeout: 30000
        keepalive-time: 60000
        connection-init-sql: SET time_zone = '+08:00'
    user:
      url: jdbc:mysql://${ALAI_DB_HOST:aliyun-2c2g}:${ALAI_DB_PORT:3307}/al-ai-platform-user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
      username: ${ALAI_DB_USER:root}
      password: ${ALAI_DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        max-lifetime: 580000
        idle-timeout: 520000
        connection-timeout: 30000
        keepalive-time: 60000
        connection-init-sql: SET time_zone = '+08:00'
    # biz 数据源：业务表就绪后再启用 spring.datasource.biz

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

alai:
  # 登录密码传输：前端 RSA 公钥加密，后端私钥解密（Base64 DER）
  crypto:
    rsa:
      public-key: ${ALAI_RSA_PUBLIC_KEY:}
      private-key: ${ALAI_RSA_PRIVATE_KEY:}
  # 管理端超管（写在配置，不依赖 DB；可用环境变量覆盖）
  admin:
    super:
      username: ${ALAI_SUPER_USERNAME:superadmin}
      password: ${ALAI_SUPER_PASSWORD:SuperAdmin@8282}
      nickname: 超级管理员
  llm:
    default-base-url: ${ALAI_LLM_BASE_URL:http://127.0.0.1:11434/v1}
    default-api-key: ${ALAI_LLM_API_KEY:sk-local}
    default-model: ${ALAI_LLM_MODEL:qwen2.5}

logging:
  level:
    root: INFO
    com.al.ai.platform: DEBUG
